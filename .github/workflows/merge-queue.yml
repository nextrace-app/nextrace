name: merge queue

on:
  pull_request_target:
    types:
      - labeled
  workflow_dispatch:

# One queue runner at a time. A run that is waiting behind the active one is replaced by a newer one,
# which is fine because every run drains the whole queue. Unrelated labels get a unique group so they
# never cancel a waiting queue run.
concurrency:
  group: ${{ (github.event.label.name == 'merge-queue' || github.event_name == 'workflow_dispatch') && 'merge-queue' || format('skip-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read

jobs:
  queue:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'merge-queue'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # pull_request_target checks out the base branch, never the PR code.
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Process the queue
        env:
          # A token that is not GITHUB_TOKEN also lets branch updates trigger the normal pull_request checks
          # and lets main changes to .github/workflows be merged into PR branches.
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}
        run: bash .github/scripts/merge-queue.sh
